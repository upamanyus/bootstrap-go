name = "bootstrapGo"
defaultTargets = ["Checkers"]

# The Perennial framework (Lean port, branch `lean` of mit-pdos/perennial).
# Its `goose/` is also the Go library and translator this repository uses
# (go.mod replaces github.com/mit-pdos/perennial with .lake/packages/perennial).
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "8c75a3dd4afb507c789271e2ee85c2aaec7a7bf3"

# The Lean port of the etcd raft election proof (branch `lean` of
# upamanyus/etcd-grove). Only the table-driven checker's raft client uses it:
# its rules are that development's accessor lemmas.
# A private repository, so it is fetched over ssh.
[[require]]
name = "etcdGrove"
git = "git@github.com:upamanyus/etcd-grove"
rev = "51d6df02dd3ffae5f2a95a83145978c35eab60a6"

# Goose output for this repository's Go packages (generated; do not edit).
[[lean_lib]]
name = "Generated"
globs = ["Generated.+"]

# The Lean-native checker `lcheck`: the checker's data and algorithm, with no
# program logic (imports only Perennial.Std), compiled to native code so that
# `native_decide` runs it as machine code. Its soundness proof is in Checkers.
[[lean_lib]]
name = "LCheck"
precompileModules = true

# The checkers' Rocq development, ported.
[[lean_lib]]
name = "Checkers"

[leanOptions]
linter.unusedSectionVars = false
